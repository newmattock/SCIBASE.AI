<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Reputation transparency receipt demo</title>
  <desc id="desc">A static walkthrough of the reputation transparency receipts module output.</desc>
  <rect width="960" height="540" fill="#101820"/>
  <rect x="40" y="40" width="880" height="460" rx="12" fill="#f8fbff"/>
  <text x="72" y="96" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17202a">Reputation Transparency Receipts</text>
  <text x="72" y="132" font-family="Arial, sans-serif" font-size="16" fill="#52616f">SCIBASE Community and User Reputation System milestone</text>
  <rect x="72" y="168" width="242" height="118" rx="8" fill="#e9f5ff"/>
  <text x="94" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#12344d">Review receipts</text>
  <text x="94" y="237" font-family="Arial, sans-serif" font-size="15" fill="#24445c">Public and blinded modes</text>
  <text x="94" y="262" font-family="Arial, sans-serif" font-size="15" fill="#24445c">Evidence anchors preserved</text>
  <rect x="359" y="168" width="242" height="118" rx="8" fill="#ecf8ef"/>
  <text x="381" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164224">Credit receipts</text>
  <text x="381" y="237" font-family="Arial, sans-serif" font-size="15" fill="#2b5938">CRediT roles and artifacts</text>
  <text x="381" y="262" font-family="Arial, sans-serif" font-size="15" fill="#2b5938">Verified contribution history</text>
  <rect x="646" y="168" width="242" height="118" rx="8" fill="#fff3dc"/>
  <text x="668" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#5c3b00">Moderation queue</text>
  <text x="668" y="237" font-family="Arial, sans-serif" font-size="15" fill="#6d4a08">Self-endorsement guard</text>
  <text x="668" y="262" font-family="Arial, sans-serif" font-size="15" fill="#6d4a08">Thin review warnings</text>
  <rect x="72" y="326" width="816" height="112" rx="8" fill="#17202a"/>
  <text x="104" y="365" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Deterministic output</text>
  <text x="104" y="397" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Global, domain, and institution leaderboards expose the exact signal breakdown behind each reputation tier.</text>
  <text x="104" y="422" font-family="Arial, sans-serif" font-size="15" fill="#d7e1ea">Every receipt contributes to a stable evidence digest for audit and reviewer handoff.</text>
</svg>
