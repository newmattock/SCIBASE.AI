<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Output Evidence Verifier demo</title>
  <desc id="desc">Reviewer dashboard showing AI output source coverage, blockers, reviewer tasks, and audit digest.</desc>
  <rect width="1280" height="720" fill="#f5f7f9"/>
  <rect x="64" y="54" width="1152" height="612" rx="18" fill="#ffffff" stroke="#cfd8df" stroke-width="2"/>
  <text x="104" y="126" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#17212b">AI Output Evidence Verifier</text>
  <text x="104" y="158" font-family="Inter, Arial, sans-serif" font-size="18" fill="#526371">Research-assistant output trust gate for SCIBASE issue #13</text>
  <g>
    <rect x="104" y="220" width="252" height="150" rx="14" fill="#e9f6f0" stroke="#9fd0ba" stroke-width="2"/>
    <text x="126" y="262" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#174831">Source Coverage</text>
    <text x="126" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#27634a">known IDs</text>
    <text x="126" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#27634a">missing IDs</text>
  </g>
  <g>
    <rect x="386" y="220" width="252" height="150" rx="14" fill="#fff0e6" stroke="#e9b489" stroke-width="2"/>
    <text x="408" y="262" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#793b10">Evidence Risk</text>
    <text x="408" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8f4e20">unsupported claims</text>
    <text x="408" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#8f4e20">retracted sources</text>
  </g>
  <g>
    <rect x="668" y="220" width="252" height="150" rx="14" fill="#edf2fb" stroke="#abc0e7" stroke-width="2"/>
    <text x="690" y="262" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#203c69">Disclosures</text>
    <text x="690" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#31558f">AI generated</text>
    <text x="690" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#31558f">human review</text>
  </g>
  <g>
    <rect x="950" y="220" width="226" height="150" rx="14" fill="#f8edf7" stroke="#d5abd0" stroke-width="2"/>
    <text x="972" y="262" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#5a2854">Audit Digest</text>
    <text x="972" y="303" font-family="Inter, Arial, sans-serif" font-size="18" fill="#73386b">policy hash</text>
    <text x="972" y="334" font-family="Inter, Arial, sans-serif" font-size="18" fill="#73386b">review packet</text>
  </g>
  <rect x="104" y="424" width="1072" height="168" rx="14" fill="#17212b"/>
  <text x="132" y="473" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Neurovascular Calcium Imaging Protocol</text>
  <text x="132" y="514" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c8d3dc">3 AI outputs, 5 claims, 3 sources, deterministic reviewer tasks</text>
  <text x="132" y="550" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c8d3dc">Recommendation: hold for evidence fix before collaborator release</text>
  <text x="132" y="586" font-family="Inter, Arial, sans-serif" font-size="18" fill="#c8d3dc">Blocks unsupported, high-risk, and retracted-source claims</text>
</svg>
