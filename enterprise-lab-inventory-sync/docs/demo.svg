  <text x="80" y="126" font-family="Arial, sans-serif" font-size="15" fill="#475569">Northbridge Translational Research • evidence digest 0f66ae20eddd2e69</text>
  <g font-family="Arial, sans-serif">
    <rect x="80" y="160" width="180" height="110" rx="8" fill="#fee2e2"/>
